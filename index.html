<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Tap & Earn Pro</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: 'Arial', sans-serif; text-align: center; margin: 0; background: #0f0f0f; color: white; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; }
        #score-display { font-size: 50px; font-weight: bold; color: #f1c40f; margin-bottom: 10px; }
        .coin { width: 180px; height: 180px; background: radial-gradient(circle, #f39c12, #d35400); border-radius: 50%; border: 6px solid #fff; box-shadow: 0 0 20px #f39c12; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 70px; transition: transform 0.1s; user-select: none; }
        .coin:active { transform: scale(0.9); }
        
        /* Popup Box */
        #overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 100; flex-direction: column; align-items: center; justify-content: center; }
        .btn { background: #0088cc; color: white; padding: 15px 30px; border-radius: 10px; text-decoration: none; font-weight: bold; margin-top: 20px; border: none; cursor: pointer; }
        #withdraw-btn { display: none; background: #27ae60; margin-top: 20px; }
    </style>
</head>
<body>

    <div id="score-display">💰 <span id="score">0</span></div>
    <div class="coin" id="tap-btn">🪙</div>
    
    <button id="withdraw-btn" class="btn" onclick="alert('ထုတ်ယူရန် တောင်းဆိုမှု တင်သွင်းပြီးပါပြီ!')">Withdraw Money (1000 Points)</button>

    <div id="overlay">
        <h2>Channel အရင် Join ပါ</h2>
        <p>ဆက်လက်နှိပ်ရန် ကျွန်ုပ်တို့၏ Channel ကို Join ပေးရပါမယ်။</p>
        <a href="https://t.me/https://t.me/https://t.me/guaytoegyi" class="btn" target="_blank">Join Channel Now</a>
        <button class="btn" style="background: #555;" onclick="checkJoin()">Joined (ဆက်လုပ်မယ်)</button>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();
        
        let score = 0;
        let hasJoined = false;

        const scoreEl = document.getElementById('score');
        const overlay = document.getElementById('overlay');
        const withdrawBtn = document.getElementById('withdraw-btn');

        document.getElementById('tap-btn').addEventListener('touchstart', (e) => {
            score += 1;
            scoreEl.innerText = score;

            // အဆင့် ၁: ၁၀၀ ပြည့်လျှင် Channel Join ခိုင်းခြင်း
            if (score >= 100 && !hasJoined) {
                overlay.style.display = 'flex';
            }

            // အဆင့် ၂: ၁၀၀၀ ပြည့်လျှင် Withdraw ခလုတ်ပေါ်ခြင်း
            if (score >= 1000) {
                withdrawBtn.style.display = 'block';
            }

            tg.HapticFeedback.impactOccurred('light');
        });

        function checkJoin() {
            hasJoined = true;
            overlay.style.display = 'none';
        }
    </script>
</body>
</html>
