<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Easy Bonus Mining Pro</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.1/firebase-database-compat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0f0f0f; color: white; margin: 0; padding: 15px; text-align: center; }
        .card { background: #1e1e1e; border-radius: 20px; padding: 25px; margin-bottom: 20px; border: 1px solid #333; box-shadow: 0 10px 20px rgba(0,0,0,0.5); }
        .balance-amount { font-size: 36px; font-weight: bold; color: #f1c40f; margin: 10px 0; font-family: monospace; }
        .btn { border: none; padding: 12px; border-radius: 12px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 10px; }
        .withdraw-btn { background: #5d3fd3; color: white; }
        .invite-btn { background: #27ae60; color: white; }
        .task-item { background: #1e1e1e; padding: 15px; border-radius: 15px; display: flex; align-items: center; margin-bottom: 10px; border: 1px solid #222; text-align: left; }
        .task-info { flex: 1; margin-left: 10px; }
        .task-reward { font-size: 12px; color: #f1c40f; }
        .join-btn { background: #0088cc; border: none; color: white; padding: 8px 15px; border-radius: 8px; font-size: 12px; }
    </style>
</head>
<body>

    <div class="card">
        <div id="user-display" style="font-weight: bold; color: #0088cc;">Loading Account...</div>
        <div style="font-size: 14px; color: #888; margin-top: 10px;">AVAILABLE BALANCE</div>
        <div class="balance-amount">$ <span id="balance">0.0000000000</span></div>
        <button class="btn withdraw-btn" onclick="withdraw()">WITHDRAW</button>
        <button class="btn invite-btn" onclick="copyReferral()">INVITE FRIENDS (+$1.00)</button>
    </div>

    <div style="text-align: left; font-weight: bold; margin: 20px 0 10px;">TASKS</div>
    <div class="task-item">
        <i class="fab fa-telegram" style="font-size: 24px; color: #0088cc;"></i>
        <div class="task-info">
            <div style="font-size: 14px;">Join Official Channel</div>
            <div class="task-reward">+$0.50 Bonus</div>
        </div>
        <button class="join-btn" onclick="doTask('https://t.me/AAA3ycc')">JOIN</button>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        // --- Firebase Config (သင့် Key များကို ဤနေရာတွင် ထည့်ပြီးသားဖြစ်သည်) ---
        const firebaseConfig = {
            apiKey: "AIzaSyBVKvDQUqPY1RCw3FcJN8GdpgwR1jenSbU",
            authDomain: "my-mining-bot-75cc5.firebaseapp.com",
            databaseURL: "https://my-mining-bot-75cc5-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "my-mining-bot-75cc5",
            storageBucket: "my-mining-bot-75cc5.firebasestorage.app",
            messagingSenderId: "528479089466",
            appId: "1:528479089466:web:d91cbd2980dd211f79d603"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let userId = tg.initDataUnsafe.user ? tg.initDataUnsafe.user.id : "test_user";
        let userName = tg.initDataUnsafe.user ? tg.initDataUnsafe.user.first_name : "User";
        document.getElementById('user-display').innerText = "Account: " + userName;

        let balance = 0;
        const balanceEl = document.getElementById('balance');

        // ၁။ ဒေတာ ပြန်ယူခြင်း
        db.ref('users/' + userId).on('value', (snapshot) => {
            if (snapshot.exists()) {
                balance = snapshot.val().balance;
                balanceEl.innerText = balance.toFixed(10);
            }
        });

// ၂။ Mining (၁ စက္ကန့်တိုင်း တိုးမည်)
        setInterval(() => {
            balance += 0.0000000951;
            balanceEl.innerText = balance.toFixed(10);
        }, 1000);

        // ၃။ Database သိမ်းခြင်း (၅ စက္ကန့်တစ်ခါ)
        setInterval(() => {
            db.ref('users/' + userId).update({
                name: userName,
                balance: balance
            });
        }, 5000);

        // ၄။ Referral Link (လူဖိတ်ရန်)
        function copyReferral() {
            let botLink = "https://t.me/@Gmailfor123Bot?start=" + userId;
            const el = document.createElement('textarea');
            el.value = "ဒီ Bot မှာ ပိုက်ဆံတွေ အလကား Mining လုပ်လို့ရတယ်နော်။ ဒီမှာနှိပ်ပြီး စမ်းကြည့်ပါ- " + botLink;
            document.body.appendChild(el);
            el.select();
            document.execCommand('copy');
            document.body.removeChild(el);
            alert("သင့်ရဲ့ Referral Link ကို Copy ကူးပြီးပါပြီ။ သူငယ်ချင်းတွေကို ပို့ပေးလိုက်ပါ။");
        }

        function doTask(link) {
            tg.openLink(link);
            setTimeout(() => {
                balance += 0.50;
                db.ref('users/' + userId).update({ balance: balance });
                alert("Bonus $0.50 ရရှိပါပြီ!");
            }, 5000);
        }

        function withdraw() {
            alert("အနည်းဆုံး $10 ပြည့်မှ ထုတ်ယူနိုင်ပါမည်။");
        }
    </script>
</body>
</html>
